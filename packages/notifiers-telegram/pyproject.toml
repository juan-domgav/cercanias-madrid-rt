[project]
name = "cercanias-notifiers-telegram"
version = "0.1.0"
description = "Adaptador de notificaciones por Telegram (C-8). El dominio no lo conoce."
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_notifiers_telegram"]
