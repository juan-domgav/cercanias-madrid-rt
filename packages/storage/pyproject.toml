[project]
name = "cercanias-storage"
version = "0.1.0"
description = "Adaptadores de publicacion de snapshot: disco local, S3 y Cloud Storage."
requires-python = ">=3.13,<3.14"
dependencies = ["cercanias-domain"]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
gcp = ["google-cloud-storage>=2.18", "google-cloud-secret-manager>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_storage"]

[tool.uv.sources]
cercanias-domain = { workspace = true }
