[project]
name = "cercanias-domain"
version = "0.1.0"
description = "Dominio: entidades, puertos y reglas de negocio. No importa nada de AWS, GCP ni Telegram."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_domain"]
