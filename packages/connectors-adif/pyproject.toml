[project]
name = "cercanias-connectors-adif"
version = "0.1.0"
description = "Conectores Adif. En Fase 0 unicamente el explorador de capacidades IDEADIF (GetCapabilities); ningun conector de datos habilitado."
requires-python = ">=3.13,<3.14"
dependencies = [
  "cercanias-domain",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_connectors_adif"]

[tool.uv.sources]
cercanias-domain = { workspace = true }
