[project]
name = "cercanias-persistence"
version = "0.1.0"
description = "Adaptadores de persistencia (en memoria en Fase 0) que implementan los puertos del dominio."
requires-python = ">=3.13,<3.14"
dependencies = [
  "cercanias-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_persistence"]

[tool.uv.sources]
cercanias-domain = { workspace = true }
