[project]
name = "cercanias-api"
version = "0.1.0"
description = "Servicio HTTP: webhook de Telegram y recogida de feedback."
requires-python = ">=3.13,<3.14"
dependencies = [
  "cercanias-domain",
  "cercanias-storage",
  "cercanias-notifiers-telegram",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[project.scripts]
api = "cercanias_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cercanias_api"]

[tool.uv.sources]
cercanias-domain = { workspace = true }
cercanias-storage = { workspace = true }
cercanias-notifiers-telegram = { workspace = true }
